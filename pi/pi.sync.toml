# Komodo Resource Sync - single source of truth for the pi worker.
# Flow: edit here -> Refresh -> Apply. Deploy=true makes Apply enforce
# "running + this exact config + latest built image version".

[[builder]]
name = "local"
[builder.config]
type = "Server"
[builder.config.params]
server = "Local"

[[build]]
name = "pi-worker"
[build.config]
builder = "local"
files_on_host = true
build_path = "/etc/komodo/pi"
dockerfile_path = "Dockerfile.pi-worker"
# no image_registry -> image stays on the local daemon

[[deployment]]
name = "pi-worker"
deploy = true
[deployment.config]
server = "Local"
image.type = "Image"
image.params.image = "pi-worker:latest"
restart = "unless-stopped"
auto_update = true
# rpc mode on stdio would exit instantly on an unstated deploy stdin
extra_args = "--interactive --init"
volumes = """
/Users/aliaksandrzhebit/Programming/azh/03/pi/pi-agent-state:/home/pi/.pi/agent
/Users/aliaksandrzhebit/Programming/azh/03/pi/pi-worker-entry:/usr/local/bin/pi-worker-entry:ro
"""
