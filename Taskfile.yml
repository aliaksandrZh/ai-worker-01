version: 3

tasks:
  komodo:
    desc: Run komodo (docker compose)
    cmds:
      - docker compose --file komodo/ferretdb.compose.yaml --env-file komodo/compose.env up

  api:
    desc: Run pi-worker start/stop api (needs api/.env, see api/.env.example)
    dir: api
    cmds:
      - npm install --no-fund --no-audit
      - npm start

  hook:
    desc: Run console webhook receiver for /sessions/:id/notify (port 3900)
    dir: api
    cmds:
      - node webhook-listener.mjs