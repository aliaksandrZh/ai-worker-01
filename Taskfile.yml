version: 3

tasks:
  stack:
    desc: 'Run the pi-agent control plane (postgres, app-host with all EventLog consumers, backup and logging stack; uses deploy/.env)'
    cmds:
      - test -f deploy/.env || cp deploy/.env.example deploy/.env
      - docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait

  stack-rebuild:
    desc: Rebuild control-plane images from current src/ (build only — starts nothing; run `task stack` after)
    cmds:
      - test -f deploy/.env || cp deploy/.env.example deploy/.env
      - docker compose --env-file deploy/.env -f deploy/compose.yaml build

  stack-logs:
    desc: Follow control-plane logs
    cmds:
      - docker compose --env-file deploy/.env -f deploy/compose.yaml logs -f --tail=50

  stack-down:
    desc: Stop the control plane (volumes kept)
    cmds:
      - docker compose --env-file deploy/.env -f deploy/compose.yaml down

  dev-db:
    desc: Start the host-run debugging infra (postgres only, published on 127.0.0.1:5432)
    cmds:
      - test -f deploy/.env || cp deploy/.env.example deploy/.env
      - docker compose --env-file deploy/.env -f deploy/compose.yaml up -d postgres --wait

  dev-app:
    desc: Run the app host on the host (schema is bootstrapped idempotently at startup)
    deps: [dev-db]
    env:
      ConnectionStrings__DefaultDb: Host=localhost;Database=pi_agent;Username=pi_agent;Password=change-me
      PI_AGENT_CONFIG_DIR: deploy/config
      PI_AGENT_GITHUB_PAT_FILE: secrets/github-sync-pat.txt
      PI_AGENT_GITHUB_WRITE_PAT_FILE: secrets/github-write-pat.txt
      Publisher__PatFile: secrets/github-write-pat.txt
      RunWorker__WorkspaceRoot: runtime/runs
      RunWorker__CallbackBaseUrl: http://localhost:8080
      Workers__Orchestrator__Enabled: "true"
      Workers__Publisher__Enabled: "true"
      Workers__GithubSync__Enabled: "true"
      Workers__RunWorker__Enabled: "false"
    cmds:
      - dotnet run --project src/Hosts/AppHost --no-launch-profile

  build-agents:
    desc: 'Build agent profile images (agent-<profile>:v1) the Run Worker starts; deploy-time step until the build plane is reworked'
    cmds:
      - cmd: |
          for p in agents/*/; do
            n=$(basename "$p")
            [ "$n" = "_runtime" ] && continue
            docker build -t "agent-$n:v1" "$p" || exit 1
          done
