version: 3

tasks:
  stack:
    desc: Run the pi-agent control plane (postgres, migrator, runtime-api, host-monitor, build-worker, orchestrator, poller, outbox-worker; uses src/.env)
    cmds:
      - test -f src/.env || cp src/.env.example src/.env
      - docker compose --env-file src/.env -f src/compose.yaml up -d --wait

  stack-rebuild:
    desc: Rebuild all control-plane images from current src/ (build only — starts nothing; run `task stack` after)
    cmds:
      - test -f src/.env || cp src/.env.example src/.env
      - docker compose --env-file src/.env -f src/compose.yaml build

  stack-logs:
    desc: Follow control-plane logs
    cmds:
      - docker compose --env-file src/.env -f src/compose.yaml logs -f --tail=50

  stack-down:
    desc: Stop the control plane (volumes kept)
    cmds:
      - docker compose --env-file src/.env -f src/compose.yaml down

  agent-komodo:
    desc: Run the Komodo deployment for the agent system (src/komodo; on shared network pi-agent-net)
    cmds:
      - docker network create pi-agent-net 2>/dev/null || true
      - test -f src/komodo/compose.env || echo "missing src/komodo/compose.env"
      - docker compose --file src/komodo/ferretdb.compose.yaml --env-file src/komodo/compose.env up
