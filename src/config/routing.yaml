# Global default rules (repository_id = NULL); per-repo overrides win, the version is
# pinned on the Task at creation (02 §12a).
# Ticket-09 posture: /plan routes to the STUB profile (the pipeline proves itself end to end) until
# tickets 10–12 land; then this rule flips back to `planner`.
rules:
  - task_type: plan
    profile: stub
    priority: 1
    enabled: true
# Per-repo override example (repository must exist in repositories.yaml):
# rules:
#   - task_type: plan
#     repository: example-org/example-repo
#     profile: planner
