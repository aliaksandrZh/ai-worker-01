name: pi-agent-control-plane

# §13 default composition: one Compose project on the single execution host.
# Startup order: postgres → migrator → build-worker / runtime-api / host-monitor → orchestrator / poller / outbox-worker.
# Decision 65 amended: PostgreSQL additionally published on 127.0.0.1 only, for local pgAdmin access.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pi_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in src/.env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432" # development-only, pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: Migrator }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: "no"
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  runtime-api:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: RuntimeApi }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    ports:
      - "${RUNTIME_API_HOST_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
      ServiceTokens__Orchestrator: ${SERVICE_TOKEN_ORCHESTRATOR}
      ServiceTokens__HostMonitor: ${SERVICE_TOKEN_HOST_MONITOR}
      ServiceTokens__BuildWorker: ${SERVICE_TOKEN_BUILD_WORKER}
      AgentContainer__CallbackBaseUrl: ${PI_CALLBACK_BASE_URL:-http://runtime-api:8080}
      Storage__ManagedRoot: /var/lib/pi-agent/workflows
      # Decision 52 tree: the Runtime API creates the physical directories; the same HOST path must
      # reach its own created agent containers via bind mounts (absolute host path of STORAGE_ROOT).
      Storage__HostRoot: ${STORAGE_HOST_ROOT:-/var/lib/pi-agent/workflows}
      Storage__SecretsManagedDir: /etc/pi-agent/secrets
      Storage__SecretsHostDir: ${PI_AGENT_SECRETS_HOST_DIR:-/etc/pi-agent/secrets}
      Storage__MaxLogMegabytes: ${PI_AGENT_MAX_LOG_MB:-50}
      WorkerLoop__IntervalSeconds: 5
      # Ticket 13: the §16 knobs (startup/idle/max_run_duration, orphan windows) come from the
      # configuration plane's system.yaml, read by the reconcilers at startup.
      PI_AGENT_CONFIG_DIR: /etc/pi-agent/config
    volumes:
      # Decision 82: the Runtime API provisions agent containers itself — the Docker socket, read-write
      # (it creates/starts/stops/removes the pi-session-* containers on pi-agent-net).
      - /var/run/docker.sock:/var/run/docker.sock
      # The managed storage root (decision 52) — writable so /start provisioning can create trees.
      - ${STORAGE_ROOT:-./storage}:/var/lib/pi-agent/workflows
      # Profile-secret existence checks (decision 54): read-only view of the host-managed files.
      - ${SECRETS_DIR:-./secrets}:/etc/pi-agent/secrets:ro
      # The configuration plane (system.yaml) for the reconcilers' §16 knobs.
      - ./config:/etc/pi-agent/config:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  host-monitor:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: HostMonitor }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    environment:
      Storage__ManagedRoot: /var/lib/pi-agent/workflows
      # Ticket 13 (decision 62): telemetry destination + the dedicated host credential.
      RuntimeApi__BaseUrl: ${RUNTIME_API_URL:-http://runtime-api:8080}
      RuntimeApi__ServiceToken: ${SERVICE_TOKEN_HOST_MONITOR}
      WorkerLoop__IntervalSeconds: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STORAGE_ROOT:-./storage}:/var/lib/pi-agent/workflows
    depends_on:
      migrator:
        condition: service_completed_successfully

  build-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: BuildWorker }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    environment:
      WorkerLoop__IntervalSeconds: 5
      # Decision-65 contour: the build endpoints accept the caller's dedicated service credential
      # (the Orchestrator presents its own token — same direction/shape as the Runtime API contour).
      ServiceTokens__Orchestrator: ${SERVICE_TOKEN_ORCHESTRATOR}
      # Durable local build-job state (02 §12b/decision 81: results retrievable after restarts; the
      # worker has no database). Build logs + materialized pinned contexts live under the same root.
      Build__StateRoot: /var/lib/pi-agent/builds
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BUILD_STATE_ROOT:-./builds}:/var/lib/pi-agent/builds
    depends_on:
      migrator:
        condition: service_completed_successfully

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: Orchestrator }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    volumes:
      # Configuration plane (01 §2): YAML is the source of desired configuration, synced only at startup.
      - ./config:/etc/pi-agent/config:ro
      # Host-managed secrets (decisions 50/54): the read-only sync PAT for the GET /user identity check.
      # compose auto-creates ./secrets if absent; a missing PAT file is then a diagnosable config error.
      - ./secrets:/etc/pi-agent/secrets:ro
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
      ServiceTokens__Orchestrator: ${SERVICE_TOKEN_ORCHESTRATOR}
      # Ticket 09: the Runtime API the dispatcher calls + the decision-65 service credential it presents.
      RuntimeApi__BaseUrl: ${RUNTIME_API_URL:-http://runtime-api:8080}
      RuntimeApi__ServiceToken: ${SERVICE_TOKEN_ORCHESTRATOR}
      # Ticket 10 (decision 81): the Build Worker the dispatcher calls + the decision-65 credential it presents.
      BuildWorker__BaseUrl: ${BUILD_WORKER_URL:-http://build-worker:8080}
      BuildWorker__ServiceToken: ${SERVICE_TOKEN_ORCHESTRATOR}
      PI_AGENT_CONFIG_DIR: /etc/pi-agent/config
      PI_AGENT_GITHUB_PAT_FILE: /etc/pi-agent/secrets/github-sync-pat.txt
      # Optional metadata pinned into agent profile versions (owner ruling: traceability only).
      PI_AGENT_SOURCE_COMMIT: ${PI_AGENT_SOURCE_COMMIT:-}
      WorkerLoop__IntervalSeconds: 5
    depends_on:
      migrator:
        condition: service_completed_successfully
      runtime-api:
        condition: service_started
      build-worker:
        condition: service_started

  poller:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: Poller }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    volumes:
      # §16 polling knobs (decision 53: poll_interval / poll_overlap / per_page from system.yaml).
      - ./config:/etc/pi-agent/config:ro
      # The one read-only polling PAT for ALL configured repositories (decisions 50/65) —
      # the same github-sync-pat.txt the Config Loader uses.
      - ./secrets:/etc/pi-agent/secrets:ro
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
      PI_AGENT_CONFIG_DIR: /etc/pi-agent/config
      PI_AGENT_GITHUB_PAT_FILE: /etc/pi-agent/secrets/github-sync-pat.txt
      WorkerLoop__IntervalSeconds: 5
    depends_on:
      migrator:
        condition: service_completed_successfully

  outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: OutboxWorker }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    volumes:
      # The one §16 knob the outbox worker reads directly: outbox_retry_window (plan ruling 5).
      - ./config:/etc/pi-agent/config:ro
      # Host-managed write PAT (decision 50): publishes orchestration-owned comments (task 03).
      - ./secrets:/etc/pi-agent/secrets:ro
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
      PI_AGENT_CONFIG_DIR: /etc/pi-agent/config
      PI_AGENT_GITHUB_WRITE_PAT_FILE: /etc/pi-agent/secrets/github-write-pat.txt
      WorkerLoop__IntervalSeconds: 5
    depends_on:
      migrator:
        condition: service_completed_successfully

  backups:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in src/.env}
      POSTGRES_DB: ${POSTGRES_DB:-pi_agent}
      BACKUP_DB_HOST: postgres
      BACKUPS_DIR: /backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
    volumes:
      - ./backup/backup-loop.sh:/scripts/backup-loop.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  config-snapshot:
    # alpine/git latest is acceptable for the dev snapshot loop; pin when this ships
    image: alpine/git:latest
    restart: unless-stopped
    environment:
      CONFIG_SNAPSHOT_REPO_URL: ${CONFIG_SNAPSHOT_REPO_URL:-}
      CONFIG_SNAPSHOT_INTERVAL_MINUTES: ${CONFIG_SNAPSHOT_INTERVAL_MINUTES:-1440}
      BACKUPS_DIR: /backups
    volumes:
      - ./backup/config-snapshot-loop.sh:/scripts/config-snapshot-loop.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/config-snapshot-loop.sh"]

  # Centralized logging (config in src/logging/): every service logs §14 JSON to stdout and
  # Alloy ships it to Loki with a `service` label (compose service name); Grafana serves the
  # one provisioned log-list dashboard (Pi Agent Logs) on 127.0.0.1. No .NET or logging-driver
  # changes — docker-json-file stays, so `docker compose logs` keeps working.
  loki:
    image: grafana/loki:3.6.22
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      # development-only LogQL / logcli endpoint (127.0.0.1, same posture as postgres:5432)
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker API for log tailing (same read-only socket mount as host-monitor).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data # tail positions: no re-ingested dupes after restarts
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      # the one log lake UI: http://localhost:3000 → dashboard "Pi Agent Logs"
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in src/.env}
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  pgdata:
  backups:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  default:
    name: pi-agent-net
