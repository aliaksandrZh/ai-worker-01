# Projects v2 boards the Poller syncs (items + field changes → project_item_* events).
# `owner` is the account owning the board (user-owned boards are addressed as /users/{owner}/projectsV2/{number});
# `number` comes from the board URL: https://github.com/users/<owner>/projects/<number>/views/...
# The sync PAT needs read access to each configured board (the owner's PAT, or the board shared
# with the PAT's account with read access).
#
# Board trigger (optional `auto_plan`, Orchestrator-side): when an item's `status_field` moves
# `from → to` on the board, the Orchestrator admits the system-owned plan Task on the item's work
# item — equivalent to the human posting `/plan` at that moment (no comment, no reply). Guards: the
# work item must be open, the workflow not failed/closed, and the planner profile version ready; if
# another Task is running the trigger defers until the Workflow is idle. Values are exact-case.
#
# Board trigger (optional `auto_code`): same mechanics for the coder — the `from → to` move plus the
# `AI:Code` label admits the system-owned implement Task (equivalent to `/code`). Guards: the plan
# must have produced a successful plan artifact (the coder implements an approved plan), the item
# open, the workflow not failed/closed, the coder profile version ready.
#
# Board trigger (optional `auto_fix`): the review→fix round — when the card moves `from → to` (the
# review demanded changes and the Orchestrator moved it back) plus the `AI:Code` label, an implement
# Task continues the EXISTING pull request branch from the review findings: no plan artifact is
# required, the pinned `git.branch` (the PR's head branch) rides the frozen input, and the coder
# never opens a second pull request.
#
# Board trigger (optional `auto_review`): the automatic review start — the `from → to` move plus the
# `AI:Review` label on the card admits the system-owned review Task on the card's LINKED open pull
# request (WorkItemLink; no linked open PR — the event is consumed with a log line).
#
# Board status config (optional `ai_statuses`): the columns the Orchestrator itself moves on the
# board — `processing` when a run is handed off (AI Processing), `review` when an implement Task
# succeeds (the PR is up), `testing` when a review Task succeeds without changes requested. A
# null/absent key means "do not move the board for that state". `code_statuses` are the columns the
# MANUAL /code is allowed in (STATUS + LABEL holds for the manual command too: Ready / In Progress);
# `review_statuses` are the columns a review launch (manual /review, label scanner, bot-requested
# reviewer) is allowed in — the review runs only while the card sits in one of them. An item not on
# the board is not verified (fail open). Values are exact-case single-select option names.
#
# Review loop config (optional `review_loop`): `max_rounds` caps the automatic review→fix rounds
# per card. When a review demands changes and the cap is already reached, the card STAYS in the
# review column, the item is marked `AI Failed`, a `review_loop_exhausted` comment explains, and a
# human takes over (any manual task-producing command resets the counter). Default: 3.
projects:
  - owner: aliaksandrZh
    number: 7
    auto_plan:
      status_field: Status
      from: Backlog
      to: Clarifying
    auto_code:
      status_field: Status
      from: Clarifying
      to: Ready
    auto_fix:
      status_field: Status
      from: In Review
      to: In Progress
    auto_review:
      status_field: Status
      from: In Progress
      to: In Review
    ai_statuses:
      status_field: Status
      processing: In Progress
      review: In Review
      testing: Testing
      code_statuses: [Ready, In Progress]
      review_statuses: [In Review]
    review_loop:
      max_rounds: 3
