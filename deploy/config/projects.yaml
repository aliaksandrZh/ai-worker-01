# Projects v2 boards the Poller syncs (items + field changes → project_item_* events).
# `owner` is the account owning the board (user-owned boards are addressed as /users/{owner}/projectsV2/{number});
# `number` comes from the board URL: https://github.com/users/<owner>/projects/<number>/views/...
# The sync PAT needs read access to each configured board (the owner's PAT, or the board shared
# with the PAT's account with read access).
#
# Board trigger (optional `auto_plan`, Orchestrator-side): when an item's `status_field` moves
# `from → to` on the board, the Orchestrator admits the system-owned plan Task on the item's work
# item — equivalent to the human posting `/plan` at that moment (no comment, no reply). Guards: the
# work item must be open, the workflow not failed/closed, and the planner profile version ready; if
# another Task is running the trigger defers until the Workflow is idle. Values are exact-case.
#
# Board trigger (optional `auto_code`): same mechanics for the coder — the `from → to` move plus the
# `AI:Code` label admits the system-owned implement Task (equivalent to `/code`). Guards: the plan
# must have produced a successful plan artifact (the coder implements an approved plan), the item
# open, the workflow not failed/closed, the coder profile version ready.
#
# Board status config (optional `ai_statuses`): the columns the Orchestrator itself moves on the
# board — `processing` when a run is handed off to the Runtime API (the item is AI Processing),
# `review` when an implement Task succeeds (the pull request is up). A null/absent key means "do
# not move the board for that state". `code_statuses` are the columns the MANUAL /code is allowed
# in (STATUS + LABEL holds for the manual command too: Ready / In Progress); an item not on the
# board is not verified (fail open). Values are exact-case single-select option names.
projects:
  - owner: aliaksandrZh
    number: 7
    auto_plan:
      status_field: Status
      from: Backlog
      to: Clarifying
    auto_code:
      status_field: Status
      from: Clarifying
      to: Ready
    ai_statuses:
      status_field: Status
      processing: In Progress
      review: In Review
      code_statuses: [Ready, In Progress]
