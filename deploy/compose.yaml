name: pi-agent-control-plane

# Event-driven composition (ADR-0002..0006): postgres → app-host (the single long-running
# service: EventLog + Orchestrator + Publisher + GithubSync + RunWorker consumers, gated by
# the Workers: section) + the observability stack.
# Schema is owned by the modules' idempotent bootstrap DDL (EnsureSchemaAsync at startup) —
# no migrator step. PostgreSQL additionally published on 127.0.0.1 only, for local pgAdmin.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pi_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432" # development-only, pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app-host:
    build:
      context: ../src
      dockerfile: Dockerfile
      args: { SERVICE: AppHost }
    init: true   # PID1 = docker-init: unhandled exceptions must terminate (signal semantics)
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultDb: Host=postgres;Database=${POSTGRES_DB:-pi_agent};Username=${POSTGRES_USER:-pi_agent};Password=${POSTGRES_PASSWORD}
      PI_AGENT_CONFIG_DIR: /etc/pi-agent/config
      # The single GitHub read PAT (sync) and the single write PAT (Publisher) — ADR-0001.
      PI_AGENT_GITHUB_PAT_FILE: /etc/pi-agent/secrets/github-sync-pat.txt
      PI_AGENT_GITHUB_WRITE_PAT_FILE: /etc/pi-agent/secrets/github-write-pat.txt
      Publisher__PatFile: /etc/pi-agent/secrets/github-write-pat.txt
      # Worker gates (docs/eventlog.md invariant 7): the consumers this instance runs.
      Workers__Orchestrator__Enabled: "true"
      Workers__Publisher__Enabled: "true"
      Workers__GithubSync__Enabled: "true"
      Workers__RunWorker__Enabled: "true"
      # Run Worker provisioning (docs/run-worker.md).
      RunWorker__WorkspaceRoot: /var/lib/pi-agent/runs
      # Bind sources resolve on the HOST daemon: the agent containers mount the run tree and
      # the host-managed secret files by their ABSOLUTE host paths (same directories the
      # compose binds below expose to the app host at the container paths).
      RunWorker__WorkspaceHostRoot: ${STORAGE_HOST_ROOT:-/var/lib/pi-agent/runs}
      RunWorker__SecretsDir: /etc/pi-agent/secrets
      RunWorker__SecretsHostDir: ${SECRETS_HOST_DIR:-/etc/pi-agent/secrets}
      RunWorker__AgentNetwork: pi-agent-net
      RunWorker__CallbackBaseUrl: http://app-host:8080
      # the stub's scenario lever (only the stub reads it; a stack-level acceptance driver)
      RunWorker__StubBehavior: ${RUN_WORKER_STUB_BEHAVIOR:-succeed}
      # Agent profile images are built at deploy time (task build-agents): base + agent-<profile>:latest
      RunWorker__ImageTag: latest
    volumes:
      # The Run Worker provisions agent containers — the Docker socket, read-write.
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-Run trees (workspace + session + input).
      - ${STORAGE_ROOT:-../runtime/runs}:/var/lib/pi-agent/runs
      # Configuration plane — per-file mounts (a read-only parent bind can't host nested
      # mountpoints; compose mkdirat → EROFS). The sync reads repositories.json + system.json.
      - ../deploy/config/system.json:/etc/pi-agent/config/system.json:ro
      - ../deploy/config/repositories.json:/etc/pi-agent/config/repositories.json:ro
      # Host-managed secrets (read-only).
      - ${SECRETS_DIR:-../secrets}:/etc/pi-agent/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Centralized logging (config in deploy/logging/): every service logs JSON to stdout and
  # Alloy ships it to Loki with a `service` label (compose service name); Grafana serves the
  # one provisioned log-list dashboard (Pi Agent Logs) on 127.0.0.1. No .NET or logging-driver
  # changes — docker-json-file stays, so `docker compose logs` keeps working.
  loki:
    image: grafana/loki:3.6.22
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      # development-only LogQL / logcli endpoint (127.0.0.1, same posture as postgres:5432)
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker API for log tailing.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data # tail positions: no re-ingested dupes after restarts
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      # the one log lake UI: http://localhost:3000 → dashboard "Pi Agent Logs"
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  pgdata:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  default:
    name: pi-agent-net
