# Grafana Loki — single-binary mode (monolithic), filesystem storage, 7-day retention.
# Mounted read-only into the `loki` service in deploy/compose.yaml. No auth: the Loki port is
# published on 127.0.0.1 only and the network is private (same posture as postgres).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days; the compactor deletes older chunks (see below)

# Retention (per Loki log-retention docs): compactor must have retention_enabled plus
# delete_request_store. Only meaningful because of limits_config.retention_period above.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
