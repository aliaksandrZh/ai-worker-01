<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github write-api console</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 0; padding: 16px; background: #0d1117; color: #c9d1d9; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h2 { font-size: 13px; margin: 0 0 8px; color: #8b949e; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
  label { display: block; font-size: 12px; color: #8b949e; margin: 6px 0 2px; }
  input, textarea, select { width: 100%; box-sizing: border-box; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  button { margin-top: 8px; background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #2ea043; }
  #out { background: #010409; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-top: 12px; min-height: 80px; white-space: pre-wrap; word-break: break-word; }
  .muted { color: #8b949e; }
</style>
</head>
<body>
<h1>github write-api console <span class="muted">(issues · PRs · reviews · changes — via installed GitHub App)</span></h1>
<div class="card">
  <label>API base</label><input id="base" value="http://localhost:3901">
  <label>repo (owner/name)</label><input id="repo" value="aliaksandrZh/04">
</div>
<div class="grid">
  <div class="card"><h2>read file / list dir</h2>
    <label>path</label><input id="cp" value="README.md">
    <label>ref (optional)</label><input id="cref" placeholder="branch/tag/commit">
    <button onclick="readContents()">read contents</button>
  </div>
  <div class="card"><h2>PR # / diff & files</h2>
    <label>pull request number</label><input id="pn" value="1">
    <button onclick="api('GET', p(()=>`/repos/${repo()}/pulls/${v('pn')}/diff`))">diff</button>
    <button onclick="api('GET', p(()=>`/repos/${repo()}/pulls/${v('pn')}/files`))">files</button>
  </div>
  <div class="card"><h2>create issue</h2>
    <label>title</label><input id="it" value="console test issue (delete me)">
    <label>body / labels (comma) / assignees (comma)</label>
    <textarea id="ib">created by write-api console</textarea>
    <input id="il" placeholder="labels: bug, triage">
    <input id="ia" placeholder="assignees: login">
    <button onclick="createIssue()">create issue</button>
  </div>
  <div class="card"><h2>edit issue # · close/reopen/label</h2>
    <label>issue number</label><input id="en" value="2">
    <select id="estate"><option value="">— state —</option><option>open</option><option>closed</option></select>
    <label>title / labels csv</label><input id="etitle" placeholder="new title"><input id="elabels" placeholder="labels: a,b">
    <button onclick="editIssue()">patch issue</button>
    <label>comment body</label><textarea id="cbody">test comment from console</textarea>
    <button onclick="comment()">comment on issue/PR</button>
  </div>
  <div class="card"><h2>create PR</h2>
    <label>head branch (must exist)</label><input id="ph" value="feat">
    <label>base branch</label><input id="pb" value="main">
    <label>title</label><input id="pt" value="console PR">
    <button onclick="createPR()">create PR</button>
  </div>
  <div class="card"><h2>review PR #</h2>
    <label>pull number</label><input id="rn" value="1">
    <select id="revent"><option>COMMENT</option><option>APPROVE</option><option>REQUEST_CHANGES</option></select>
    <textarea id="rbody">console review body</textarea>
    <button onclick="review()">review</button>
  </div>
  <div class="card"><h2>projects — GraphQL (Projects V2)</h2>
    <label>preset</label><select id="gpre" onchange="$('gq').value = PRESETS[this.value];"></select>
    <textarea id="gq" style="min-height:140px"></textarea>
    <button onclick="gql()">run graphql</button>
  </div>
  <div class="card"><h2>changes — edit file(s) + commit + optional PR</h2>
    <textarea id="chjson">{
  "branch": "console-demo",
  "message": "console demo commit",
  "updates": [{ "path": "demo/hello.txt", "content": "hello from console" }],
  "pr": { "title": "console demo PR" }
}</textarea>
    <button onclick="changes()">run changes</button>
  </div>
</div>
<pre id="out">output…</pre>
<script>
const $ = (id) => document.getElementById(id);
const v = (id) => $(id).value.trim();
const repo = () => v("repo");
const out = (status, text) => { $("out").textContent = `HTTP ${status}\n\n${text}`; };
const p = (path) => path();
async function api(method, path, body) {
  try {
    const res = await fetch(v("base") + path, body === undefined
      ? { method }
      : { method, headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const text = await res.text();
    let nice = text;
    try { nice = JSON.stringify(JSON.parse(text), null, 2); } catch { /* diff/text */ }
    out(res.status, nice);
  } catch (e) { out("ERR", String(e)); }
}
const withRef = () => { const r = v("cref"); return r ? { ref: r } : {}; };
const readContents = () => api("GET", p(() => `/repos/${repo()}/contents/${v("cp")}`) + (v("cref") ? `?ref=${encodeURIComponent(v("cref"))}` : ""));
const csv = (s) => s ? s.split(",").map((x) => x.trim()).filter(Boolean) : undefined;
async function createIssue() {
  const body = { title: v("it"), body: v("ib") || undefined };
  if (v("il")) body.labels = csv(v("il"));
  if (v("ia")) body.assignees = csv(v("ia"));
  return api("POST", p(() => `/repos/${repo()}/issues`), body);
}
async function editIssue() {
  const body = {};
  if (v("estate")) body.state = v("estate");
  if (v("etitle")) body.title = v("etitle");
  const labels = csv(v("elabels"));
  if (labels) body.labels = labels;
  if (!Object.keys(body).length) return out(0, "nothing to patch");
  return api("PATCH", p(() => `/repos/${repo()}/issues/${v("en")}`), body);
}
const comment = () => api("POST", p(() => `/repos/${repo()}/issues/${v("en")}/comments`), { body: v("cbody") });
const createPR = () => api("POST", p(() => `/repos/${repo()}/pulls`), { head: v("ph"), base: v("pb"), title: v("pt") });
const review = () => api("POST", p(() => `/repos/${repo()}/pulls/${v("rn")}/reviews`), { event: v("revent"), body: v("rbody") });
const changes = () => api("POST", p(() => `/repos/${repo()}/changes`), JSON.parse(v("chjson")));
const PRESETS = {
  discover: {
    query: `query($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    projectsV2(first: 10) { nodes { id title number } }
    issue(number: $number) { id title projectItems(first: 10) { nodes { id project { id title } } } }
  }
  user(login: $owner) { projectsV2(first: 10) { nodes { id title number } } }
}`,
    variables: { owner: "aliaksandrZh", repo: "04", number: 2 },
  },
  inspect: {
    query: `query($id: ID!) {
  node(id: $id) { ... on ProjectV2 {
    id title number
    items(first: 50) { nodes { id
      content { ... on Issue { id number title } }
      fieldValues(first: 10) { nodes { ... on ProjectV2ItemFieldSingleSelectValue { optionId } } }
  } }
    fields(first: 20) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } ... on ProjectV2FieldCommon { id name dataType } } }
  } } }`,
    variables: { id: "REPLACE_WITH_PROJECT_ID" },
  },
  add: {
    query: `mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } } }`,
    variables: { projectId: "REPLACE", contentId: "REPLACE_WITH_ISSUE_NODE_ID" },
  },
  status: {
    query: `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: ID!) { updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: { singleSelectOptionId: $optionId } }) { projectV2Item { id } } }`,
    variables: { projectId: "REPLACE", itemId: "REPLACE", fieldId: "REPLACE", optionId: "REPLACE" },
  },
};
const gql = () => api("POST", p(() => `/repos/${repo()}/graphql`), JSON.parse(v("gq")));
{
  const sel = $("gpre");
  for (const k of Object.keys(PRESETS)) sel.add(new Option(k, k));
  sel.add(new Option("(custom)", ""));
  sel.value = "discover";
  sel.onchange = () => { if (sel.value) $("gq").value = JSON.stringify(PRESETS[sel.value], null, 2); };
  $("gq").value = JSON.stringify(PRESETS.discover, null, 2);
}
let routes = "";
api("GET", "/health").then(() => {});
</script>
</body>
</html>
