name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test runtime bridge
        run: node --test agents/_runtime/bridge/runtime-bridge.test.mjs

  dotnet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/PiAgent.slnx

      - name: Build
        run: dotnet build src/PiAgent.slnx --no-restore

      - name: Test
        run: dotnet test src/PiAgent.slnx --no-build
