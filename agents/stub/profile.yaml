# Stub control-plane profile (ticket 08): resources/limits/secrets only — the agent's runtime
# delta (name, clone_mode) lives in agent.json in this directory. The stub speaks its own
# pi-RPC-shaped protocol; routing /plan back to the planner replaces it.
description: Stub agent proving the run pipeline (pi-RPC-shaped JSON protocol)
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 1.0
  memory: 512MiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
secrets: []
capabilities: []
