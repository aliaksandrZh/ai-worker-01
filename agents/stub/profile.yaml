# The stub agent profile: a fake headless CLI speaking a tiny pi-RPC-shaped JSON
# protocol, plus the reference Runtime Bridge baked into the image. Proves the run pipeline end to end
# while the real planner runs are being wired. Its image builds through the build
# pipeline automatically (agent-stub:v<n>); the profile must stay otherwise ordinary — routing /plan
# back to the planner replaces it.
description: Stub agent proving the run pipeline (pi-RPC-shaped JSON protocol)
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 1.0
  memory: 512MiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
bridge:
  version: "1.4.0" # must match the shared runtime-bridge stamp (agents/_runtime/bridge/bridge.json); 1.4.0 = /mcp status probe + publication toolcheck
  heartbeat_interval: 15s
  event_cadence: 5s
  behavior: succeed   # stub-only scenario lever: succeed | fail | hang | never_start | permission_denied | mcp_failed
system_prompt: |
  Stub agent: emits the mapped pi event set, writes the artifacts/ convention files, and settles.
secrets: []
capabilities: []
