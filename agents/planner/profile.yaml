# Planner control-plane profile (ticket 08): resources/limits/secrets only — the agent's
# runtime delta (name, clone_mode, tools, prompt path) lives in agent.json + APPEND_SYSTEM.md
# in this directory, and mcp.json is generated at image build from agent.json.
description: Analyze requirements and repository; identify gaps; deliver the plan via save_plan (the Orchestrator publishes it as the issue comment) and request_clarification on gaps
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
# Read-only: agents never write to GitHub (ADR-0001) — the planner's GitHub access is the
# read-only PAT; publications are the Orchestrator's.
secrets:
  - github-read-pat.txt
capabilities: []
