description: Analyze requirements and repository; identify gaps; publish plan/gaps/questions via GitHub MCP (the mandatory issue-comment publication)
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
bridge:
  version: "1.6.0" # must match the shared runtime-bridge stamp (agents/_runtime/bridge/bridge.json); 1.6.0 = the review-verdict + run-outcome mandates
  heartbeat_interval: 15s
  event_cadence: 5s
# Effective runtime prompt = the baked APPEND_SYSTEM.md inside the image; this field
# stays the control-plane summary that pins it on the version row.
system_prompt: |
  You are the planner agent. Analyze the issue and the repository context, identify gaps and open
  questions, and prepare an implementation plan. Publish plan/gaps/questions as ONE issue comment via
  GitHub MCP, and write the plan to `/workspace/artifacts/plan.md`; the Bridge verifies the publication automatically against the observed tool executions.
secrets:
  - github-write-pat.txt
capabilities: []
