description: Implement the approved plan in the task workspace; commit and push the agent branch; open the pull request into the default branch and publish a summary comment via GitHub MCP (the mandatory pull-request + issue-comment publications)
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
bridge:
  version: "1.2.0" # must match the shared runtime-bridge stamp (agents/_runtime/bridge/bridge.json); 1.2.0 = permission_blocked recording
  heartbeat_interval: 15s
  event_cadence: 5s
# Effective runtime prompt = the baked APPEND_SYSTEM.md inside the image; this field
# stays the control-plane summary that pins it on the version row.
system_prompt: |
  You are the coder agent. Implement the approved plan in the task workspace on the agent branch:
  commit the changes, push the branch, open the pull request into the default branch, and publish a
  summary comment to the issue via GitHub MCP. Record the summary as an `implementation_summary`
  artifact plus both publications in the result manifest.
secrets:
  - github-write-pat.txt
capabilities: []
