# Coder control-plane profile (ticket 08): resources/limits/secrets only — the agent's
# runtime delta (name, clone_mode, tools, prompt path) lives in agent.json + APPEND_SYSTEM.md
# in this directory, and mcp.json is generated at image build from agent.json.
description: Implement the approved plan in the task workspace; deliver the agent branch via git push (the single write carve-out, ADR-0001) and the pull-request description via submit_pr_description
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
# The repo-scoped write PAT: the coder's git-push credential (the carve-out) and the source of
# the read-only GitHub MCP context reads. No GitHub API write anywhere.
secrets:
  - github-write-pat.txt
capabilities: []
