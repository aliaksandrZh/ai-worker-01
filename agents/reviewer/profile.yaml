# Reviewer control-plane profile (ticket 08): resources/limits/secrets only — the agent's
# runtime delta (name, clone_mode, tools, prompt path) lives in agent.json + APPEND_SYSTEM.md
# in this directory, and mcp.json is generated at image build from agent.json.
description: Review the pinned head in a fresh read-only workspace; deliver findings via submit_review_comments and needs-user issues via request_decision (the Orchestrator publishes to the PR)
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
# Read-only: agents never write to GitHub (ADR-0001) — not even the review submission; the
# reviewer's GitHub access is the read-only PAT.
secrets:
  - github-read-pat.txt
capabilities: []
