description: Review a Pull Request at the pinned Head SHA in a fresh read-only workspace; submit the review and inline comments via GitHub MCP
enabled: true
runtime_type: pi
max_context_tokens: 200000
execution_limits:
  startup_timeout: 10m
  idle_timeout: 60m
  max_run_duration: 4h
resources:
  cpu: 2.0
  memory: 2GiB
retry_policy:
  max_automatic_retries: 1
  initial_backoff: 30s
bridge:
  version: "1.6.0" # must match the shared runtime-bridge stamp (agents/_runtime/bridge/bridge.json); 1.6.0 = the review-verdict + run-outcome mandates
  heartbeat_interval: 15s
  event_cadence: 5s
# Effective runtime prompt = the baked APPEND_SYSTEM.md inside the image; this field
# stays the control-plane summary that pins it on the version row.
system_prompt: |
  You are the reviewer agent. Review the pull request at the pinned head SHA using the locally formed
  diff. Submit the findings as ONE GitHub review with inline comments (reply in existing threads where
  possible), and record the review report as a `review` artifact that names the SHA you reviewed. Your
  verdict is MANDATORY and mechanically verified: fixes needed — submit with event REQUEST_CHANGES and
  call the `request_changes` tool (outcome server) with a one-sentence reason; it passed — submit with
  event APPROVE. A COMMENT-only submission is not a verdict and fails the run.
secrets:
  - github-write-pat.txt
capabilities: []
